name: publish

# Publishes the sdk/python package (pamone-obs) to PyPI when a GitHub Release
# is published (or run manually from the Actions tab).
#
# Uses PyPI Trusted Publishing (OIDC): no API token is stored. Configure a
# "pending publisher" on PyPI first (see sdk/python/PUBLISHING.md):
#   Project name : pamone-obs
#   Owner        : bennnr
#   Repository   : pamone-observability
#   Workflow     : publish.yml
#   Environment  : pypi        (must match the job's `environment:` below)
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # paths are relative to the repository root, not working-directory
          packages-dir: sdk/python/dist