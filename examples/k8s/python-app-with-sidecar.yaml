# Example: a Python app using the pamone-obs SDK + the obs-agent sidecar.
#
# The app image must contain the library:
#   RUN pip install "pamone-obs>=0.1.1"
#   RUN pamone-obs install-pth          # zero-code auto-start
# No application code changes; logs are teed by the library (no shell wrapper).
#
# Replace <namespace>, <app-image>, <app-port>; set the ingest token to the
# platform's INGEST_TOKEN.
apiVersion: v1
kind: Namespace
metadata:
  name: my-app
---
apiVersion: v1
kind: Secret
metadata:
  name: obs-ingest-token
  namespace: my-app
type: Opaque
stringData:
  token: "REPLACE_WITH_INGEST_TOKEN"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: my-app
  labels:
    app: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      # fsGroup applies to ALL containers: the app (uid 1000) writes the sink,
      # the sidecar (uid 10001, supplementary gid 1000) reads it.
      securityContext:
        fsGroup: 1000
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      containers:
        - name: app
          image: <your-python-app-image>
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8000 # <app-port>
          env:
            - { name: PAMONE_SINK_DIR, value: /var/log/pamone }
            # set "false" for metrics + logs only (no tracer / Datadog not used)
            - { name: PAMONE_TRACES_ENABLED, value: "true" }
          volumeMounts:
            - { name: pamone-sink, mountPath: /var/log/pamone }
          resources:
            limits: { cpu: 500m, memory: 512Mi }
            requests: { cpu: 100m, memory: 128Mi }

        - name: obs-agent
          image: pamone-registry.owllab.site/pamone-release/pamone-agent:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          env:
            - { name: AGENT_INGEST_URL, value: https://pamone.owllab.site/ingest }
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: obs-ingest-token
                  key: token
            - { name: AGENT_CLUSTER, value: <cluster-name> }
            - name: AGENT_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: AGENT_POD
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: AGENT_NODE
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - { name: AGENT_WORKLOAD_KIND, value: Deployment }
            - { name: AGENT_WORKLOAD_NAME, value: my-app }
            - { name: AGENT_CONTAINER, value: app }
            - { name: AGENT_INTERVAL, value: 10s }
            - { name: AGENT_FLUSH_INTERVAL, value: 2s }
            - { name: AGENT_OTLP_ADDR, value: ":4318" } # serves /healthz
            - { name: AGENT_LOG_PATH, value: /var/log/pamone/app.log }
            - { name: AGENT_METRICS_PATH, value: /var/log/pamone/metrics.jsonl }
            - { name: AGENT_SPANS_PATH, value: /var/log/pamone/spans.jsonl }
            - { name: AGENT_ENABLE_METRICS, value: "false" } # cgroup read by the SDK
          ports:
            - { name: otlp-http, containerPort: 4318 }
          volumeMounts:
            - { name: pamone-sink, mountPath: /var/log/pamone, readOnly: true }
          resources:
            limits: { cpu: 200m, memory: 128Mi }
            requests: { cpu: 20m, memory: 32Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 4318 }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /healthz, port: 4318 }
            initialDelaySeconds: 5
            periodSeconds: 15

      volumes:
        - name: pamone-sink
          emptyDir: {}