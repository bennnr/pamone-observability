# Example: a Go app using the pamone-obs Go SDK + the obs-agent sidecar.
#
# The app imports the module and starts it:
#   import pamone "github.com/bennnr/pamone-observability/sdk/go/pamone"
#   pamone.Init()                                   // logs + metrics
#   sdktrace.WithSpanProcessor(pamone.NewSpanProcessor()) // traces
# (or `import _ ".../sdk/go/autostart"` for logs+metrics only)
#
# This manifest uses the prebuilt example image; replace <app-image> for your own.
apiVersion: v1
kind: Namespace
metadata:
  name: my-app
---
apiVersion: v1
kind: Secret
metadata:
  name: obs-ingest-token
  namespace: my-app
type: Opaque
stringData:
  token: "REPLACE_WITH_INGEST_TOKEN"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pamone-go-example
  namespace: my-app
  labels:
    app: pamone-go-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pamone-go-example
  template:
    metadata:
      labels:
        app: pamone-go-example
    spec:
      # fsGroup applies to ALL containers; the Go example image runs as uid 10001.
      securityContext:
        fsGroup: 10001
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      containers:
        - name: app
          image: pamone-registry.owllab.site/pamone-example/pamone-go:0.1.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
          env:
            - { name: PAMONE_SINK_DIR, value: /var/log/pamone }
            - { name: PAMONE_TRACES_ENABLED, value: "true" }
          volumeMounts:
            - { name: pamone-sink, mountPath: /var/log/pamone }
          resources:
            limits: { cpu: 200m, memory: 128Mi }
            requests: { cpu: 50m, memory: 32Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10

        - name: obs-agent
          image: pamone-registry.owllab.site/pamone-release/pamone-agent:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          env:
            - { name: AGENT_INGEST_URL, value: https://pamone.owllab.site/ingest }
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: obs-ingest-token
                  key: token
            - { name: AGENT_CLUSTER, value: <cluster-name> }
            - name: AGENT_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: AGENT_POD
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: AGENT_NODE
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - { name: AGENT_WORKLOAD_KIND, value: Deployment }
            - { name: AGENT_WORKLOAD_NAME, value: pamone-go-example }
            - { name: AGENT_CONTAINER, value: app }
            - { name: AGENT_INTERVAL, value: 10s }
            - { name: AGENT_FLUSH_INTERVAL, value: 2s }
            - { name: AGENT_OTLP_ADDR, value: ":4318" }
            - { name: AGENT_LOG_PATH, value: /var/log/pamone/app.log }
            - { name: AGENT_METRICS_PATH, value: /var/log/pamone/metrics.jsonl }
            - { name: AGENT_SPANS_PATH, value: /var/log/pamone/spans.jsonl }
            - { name: AGENT_ENABLE_METRICS, value: "false" }
          ports:
            - { name: otlp-http, containerPort: 4318 }
          volumeMounts:
            - { name: pamone-sink, mountPath: /var/log/pamone, readOnly: true }
          resources:
            limits: { cpu: 200m, memory: 128Mi }
            requests: { cpu: 20m, memory: 32Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 4318 }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /healthz, port: 4318 }
            initialDelaySeconds: 5
            periodSeconds: 15

      volumes:
        - name: pamone-sink
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pamone-go-example
  namespace: my-app
  labels:
    app: pamone-go-example
spec:
  selector:
    app: pamone-go-example
  ports:
    - name: http
      port: 80
      targetPort: 8080